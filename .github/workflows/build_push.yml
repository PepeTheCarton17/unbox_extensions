name: Build & Publish Extensions

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'signingkey.jks'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Extension APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APKs
        run: |
          gradle assembleRelease --stacktrace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Artifacts & Generate Repo Index
        run: |
          mkdir -p apk_repo/apk
          mkdir -p apk_repo/icon
          find src -name "*.apk" -exec cp {} apk_repo/apk/ \;
          find src -name "*.apk" -exec cp {} apk_repo/ \;
          find src -name "ic_launcher.png" -exec cp {} apk_repo/icon/ic_launcher.png \;
          find src -name "ic_launcher.png" -exec cp {} apk_repo/icon/eu.kanade.tachiyomi.animeextension.es.animeav1.png \;
          python3 .github/scripts/generate-repo-index.py --apk-dir apk_repo/apk --out apk_repo --repo-url "https://raw.githubusercontent.com/PepeTheCarton17/unbox_extensions/gh-pages" --repo-name "Unbox Extensions" --fingerprint "2f4cdf7ed264f6e6aa0d7655b7d6222df6d9f0ffde924f0eea4c57be2dc8c75c"

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk_repo
          publish_branch: gh-pages
          force_orphan: true
