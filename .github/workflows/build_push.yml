name: Build & Publish Extensions

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Extension APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APKs
        run: |
          gradle assembleRelease --stacktrace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Artifacts & Generate Repo Index
        run: |
          mkdir -p apk_repo/apk
          mkdir -p apk_repo/icon
          find src -name "*.apk" -exec cp {} apk_repo/apk/ \;
          find src -name "ic_launcher.png" -exec cp {} apk_repo/icon/ \;
          python3 .github/scripts/generate-repo-index.py --apk-dir apk_repo/apk --out apk_repo --repo-url "https://pepethecarton17.github.io/unbox_extensions" --repo-name "Unbox Extensions"

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk_repo
          publish_branch: gh-pages
          force_orphan: true
